name: Finalize Stella 1.1.8 release labels and abandoned drafts
on:
  push:
    branches: [distribute/stella-1.1.8-finalize-20261028]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 release-tools/finalize-118.py
